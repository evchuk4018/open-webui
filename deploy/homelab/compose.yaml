name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG:-main}
    container_name: open-webui
    restart: unless-stopped
    ports:
      - 127.0.0.1:${OPEN_WEBUI_PORT:-3001}:8080
    environment:
      WEBUI_URL: ${WEBUI_URL:-https://ai.wowzerbowser.xyz}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      WEBUI_AUTH: "False"
      ENABLE_LOGIN_FORM: "False"
      ENABLE_SIGNUP: "False"
      CORS_ALLOW_ORIGIN: ${WEBUI_URL:-https://ai.wowzerbowser.xyz}
      ANONYMIZED_TELEMETRY: "False"
      # Seed the OpenAI-compatible connection rows on a fresh data volume.
      # Keys are intentionally empty; add them in Admin Settings after deployment.
      OPENAI_API_BASE_URLS: >-
        https://api.openai.com/v1;https://openrouter.ai/api/v1;https://opencode.ai/inference/openai/v1;https://api.deepseek.com/v1
      OPENAI_API_KEYS: ";;;"
      OPENAI_API_CONFIGS: >-
        {"0":{"enable":true,"connection_type":"external"},"1":{"enable":true,"connection_type":"external"},"2":{"enable":true,"connection_type":"external"},"3":{"enable":true,"connection_type":"external"}}
    volumes:
      - open-webui:/app/backend/data

volumes:
  open-webui:
